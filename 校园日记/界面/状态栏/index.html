<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root{--bg:#1a1a2e;--srf:#16213e;--p:#e2a7c6;--g:#7bc9a0;--e:#c97b8b;--w:#d4a76a;--t:#e0dce4;--m:#8b8599;--b:#2a2540}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font:12px/1.5 "PingFang SC","Microsoft YaHei",sans-serif;padding:8px}
.hd{text-align:center;padding:6px 0 8px;border-bottom:1px solid var(--b);margin-bottom:6px}
.hd h1{font-size:14px;color:var(--p)}
.hd .loc{font-size:10px;color:var(--m);margin-top:1px}
.card{background:var(--srf);border-radius:6px;padding:5px 8px;margin-bottom:3px;border-left:3px solid var(--b)}
.card.done{border-left-color:var(--p)}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1px}
.card .name{font-weight:600}
.card .badge{font-size:10px;color:var(--m);background:rgba(255,255,255,.05);padding:1px 5px;border-radius:3px}
.card .badge.done{color:var(--p);background:rgba(226,167,198,.15)}
.card .nums{display:flex;gap:8px;font-size:11px}
.card .nums span{white-space:nowrap}
.wait{text-align:center;color:var(--m);padding:20px 0}
</style>
</head>
<body>
<div id="app"><div class="wait">等待变量更新...</div></div>
<script>
var npcs=['沧小鱼','陆清茶','青丘雪','夏霞','爱丽丝','墨月','霍莉莉'];
var rl={善良:'善',邪恶:'恶',未确定:'-'};
var lastRender='';

function tryParse(s){
  try{var o=JSON.parse(s);return o.stat_data||o}catch(e){return null}
}

function render(s){
  if(!s){document.getElementById('app').innerHTML='<div class="wait">等待变量更新...<br><small>请发送消息触发 AI 回复</small></div>';return}
  var json=JSON.stringify(s);
  if(json===lastRender)return;
  lastRender=json;
  var h='<div class="hd"><h1>圣百合女子学院</h1><div class="loc">'+
    ((s.世界||{}).当前区域||'—')+' · '+((s.世界||{}).当前场景||'—')+' · '+((s.世界||{}).当前时间||'—')+
    ' | 暴露:'+((s.主角||{}).身份暴露风险||0)+' '+((s.主角||{}).当前伪装状态||'正常')+'</div></div>';
  for(var i=0;i<npcs.length;i++){
    var n=s[npcs[i]];if(!n)continue;
    var done=n.攻略阶段==='攻略完成';
    var af=n.好感度,fr=n.恐惧度,yd=n.屈服度,fk=n.反抗度;
    h+='<div class="card'+(done?' done':'')+'">';
    h+='<div class="top"><span class="name">'+npcs[i]+'</span><span class="badge'+(done?' done':'')+'">'+n.攻略阶段+' · '+(rl[n.攻略路线]||n.攻略路线)+'</span></div>';
    h+='<div class="nums">';
    h+='<span>好感 <b style="color:'+(af>=60?'var(--g)':af<0?'var(--e)':'var(--t)')+'">'+af+'</b></span>';
    h+='<span>恐惧 <b style="color:'+(fr>=50?'var(--e)':'var(--t)')+'">'+fr+'</b></span>';
    h+='<span>屈服 <b style="color:'+(yd>=50?'var(--e)':'var(--t)')+'">'+yd+'</b></span>';
    h+='<span>反抗 <b style="color:'+(fk>=50?'var(--w)':'var(--t)')+'">'+fk+'</b></span>';
    h+='</div></div>';
  }
  document.getElementById('app').innerHTML=h;
}

window.addEventListener('message',function(e){
  if(!e.data)return;
  var d=e.data;
  // 尝试多种数据格式
  var s=null;
  if(d.type==='mvu_data') s=d.payload||d.stat_data||d;
  else if(d.stat_data) s=d.stat_data;
  else if(typeof d==='object'&&(d.世界||d.沧小鱼)) s=d;
  if(s&&typeof s==='object') render(s);
});

// 定期通过 parent.postMessage 请求数据
setInterval(function(){
  try{parent.postMessage({type:'request_mvu_data'},'*')}catch(e){}
},2000);

render(null);
</script>
</body>
</html>
